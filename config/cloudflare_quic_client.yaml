# trojan-go-fork + Cloudflare HTTP/3 (QUIC) 客户端配置
# =====================================================
# ⚠️ 关于 "Cloudflare" 的部分：本仓库能核实的只有 trojan-go ↔ trojan-go 的 QUIC 隧道。
#    QUIC 能不能穿过 Cloudflare，取决于你开通的是 HTTP/3 站点还是 Spectrum 的 UDP 转发，
#    这两条都不在本仓库的代码里，也无法在这里验证。下面的配置是**自建 QUIC 服务端**的形状。
#
# ⚠️ 使用前请修改：remote-addr / ssl.sni / password
#
# 为什么是 custom：QUIC 只在 custom 运行类型下可达。client / server / forward / nat 的
# 栈是硬编码的，不含 QUIC 层，写 run-type: client + quic 段不会启用 QUIC。

run-type: custom
log-level: 1                      # int；级别是反的：0=All 1=Info 2=Warn 3=Error 4=Fatal 5=Off

inbound:
  node:
    - protocol: adapter
      tag: adapter
      config:
        local-addr: 127.0.0.1
        local-port: 10808
    - protocol: socks
      tag: socks
      config:
        local-addr: 127.0.0.1
        local-port: 10808
  path:
    - - adapter
      - socks

outbound:
  node:
    - protocol: quic
      tag: quic
      config:
        remote-addr: example.com      # 【需要修改】服务端 QUIC 监听地址
        remote-port: 443              # Cloudflare 只放行 443 上的 QUIC
        quic:
          alpn: hq-29                # 两端必须一致
          max-idle-timeout: 30       # 秒
          max-incoming-streams: 100
          initial-stream-window: 0   # 0 = 交给 quic-go 库内默认（512KB）
          initial-conn-window: 0
          insecure: false            # 用 CA 证书保持 false；自签测试才改 true
          congestion: bbr            # bbr / brutal / force-brutal / reno
          brutal-up: 0               # 单位 bps
          brutal-down: 0             # 单位 bps
        ssl:                         # QUIC 层自己校验证书，必须写在 quic 节点里
          sni: example.com           # 【需要修改】与域名一致
          verify: true
    - protocol: tls
      tag: tls
      config:
        ssl:
          sni: example.com
          verify: true
    - protocol: trojan
      tag: trojan
      config:
        password:
          - change-this-to-a-strong-password   # 【需要修改】
  path:
    - - quic
      - tls
      - trojan

# ==================== API 管理接口（可选，需 -tags api 构建）====================
# 真实键名是 api_addr / api_port（api/service/config.go）；这里没有 user / passwd，
# gRPC 的访问控制靠 api.ssl（含 verify_client + client_cert 白名单）。
api:
  enabled: false
  api-addr: 127.0.0.1
  api-port: 9999
  ssl:
    enabled: false
