# trojan-go-fork + Cloudflare HTTP/3 (QUIC) 服务端配置
# =====================================================
# ⚠️ 关于 "Cloudflare" 的部分：本仓库能核实的只有 trojan-go ↔ trojan-go 的 QUIC 隧道。
#    要让公网 QUIC 抵达这个服务端，你需要的是 UDP 直通（或 Spectrum 的 UDP 转发），
#    而不是站点的 HTTP/3 —— 后者会被 Cloudflare 边缘终结。这条不在本仓库代码里，无法在此验证。
#
# ⚠️ 使用前请修改：ssl.key / ssl.cert / sni / password
#
# 为什么是 custom：内置 server 运行类型的栈里没有 QUIC 层，只写 quic 段不会启用它。
# 三个实测过的坑：
#   1. quic 节点的 remote-addr / remote-port 语义是**监听地址**
#   2. 节点只能看到自己的 ctx，证书必须写在 **quic 节点自己的 config 里**，
#      否则报 `QUIC requires TLS certificate and key`
#   3. trojan 节点构造时实拨一次诱饵地址，诱饵服务必须先于本进程启动

run-type: custom
log-level: 1                      # int；级别是反的：0=All 1=Info 2=Warn 3=Error 4=Fatal 5=Off

inbound:
  node:
    - protocol: quic
      tag: quic
      config:
        remote-addr: 0.0.0.0          # 监听地址（UDP）
        remote-port: 443
        quic:
          alpn: hq-29                # 与客户端一致
          max-idle-timeout: 30
          max-incoming-streams: 100
          initial-stream-window: 0   # 0 = 交给 quic-go 库内默认（单流 2MB、连接 3MB（internal/protocol/params.go 的 DefaultInitialMaxStreamData 与其 1.5 倍））
          initial-conn-window: 0
          congestion: bbr            # bbr / brutal / force-brutal / reno
          brutal-up: 0               # 单位 bps
          brutal-down: 0             # 单位 bps
        ssl:                         # 证书写在 quic 节点里
          cert: /etc/letsencrypt/live/example.com/fullchain.pem
          key: /etc/letsencrypt/live/example.com/privkey.pem
          verify-hostname: false     # 服务端不校验客户端证书
          cert-check-rate: 1         # 秒；定期重读证书，配合续期
    - protocol: tls
      tag: tls
      config:
        ssl:
          cert: /etc/letsencrypt/live/example.com/fullchain.pem
          key: /etc/letsencrypt/live/example.com/privkey.pem
          verify-hostname: false
          cert-check-rate: 1
    - protocol: trojan
      tag: trojan
      config:
        remote-addr: 127.0.0.1        # 认证失败时的诱饵/回落地址
        remote-port: 80
        password:
          - change-this-to-a-strong-password
  path:
    - - quic
      - tls
      - trojan

outbound:
  node:
    - protocol: freedom
      tag: freedom
      config: {}
  path:
    - - freedom

# ==================== 流量持久化（可选）====================
# 顶层 `sqlite` 给一个路径即启用（实测：日志出现「已启用持久化后端：*sqlite.Persistencer」）。
# 没有 statistic.type 这种键；statistic/sqlite 由平台构建标签限制（linux + amd64/386/arm/arm64）。
# sqlite: /var/lib/trojan-go-fork/trojan-go.db

# ==================== API 管理接口（可选，需 -tags api 构建）====================
# 真实键名是 api_addr / api_port；这里没有 user / passwd，
# gRPC 的访问控制靠 api.ssl（verify_client + client_cert 白名单）。
api:
  enabled: true
  api-addr: 127.0.0.1
  api-port: 9999
  ssl:
    enabled: false
