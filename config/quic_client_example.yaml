# QUIC 客户端配置示例（custom 模式）
#
# 为什么是 custom：QUIC 隧道只在 custom 运行类型下可达。client / server / forward / nat
# 的栈是硬编码的（proxy/client/client.go:GenerateClientTree、proxy/server/server.go），
# 里面没有 QUIC 这一层，所以「run-type: client + 一个 quic 段」不会启用 QUIC。

run-type: custom

inbound:
  node:
    - protocol: adapter
      tag: adapter
      config:
        local-addr: 127.0.0.1
        local-port: 10808
    - protocol: socks
      tag: socks
      config:
        local-addr: 127.0.0.1
        local-port: 10808
  path:
    - - adapter
      - socks

outbound:
  node:
    - protocol: quic
      tag: quic
      config:
        remote-addr: example.com      # 服务端的 QUIC 监听地址【需要修改】
        remote-port: 443
        quic:
          alpn: hq-29                # 两端必须一致，否则握手失败
          max-idle-timeout: 30       # 秒；保活周期取它的一半
          max-incoming-streams: 100  # 最大并发流
          initial-stream-window: 0   # 0 = 交给 quic-go 库内默认（单流 2MB、连接 3MB（internal/protocol/params.go 的 DefaultInitialMaxStreamData 与其 1.5 倍））
          initial-conn-window: 0     # 同上
          insecure: false            # 用自签证书本地测试时要改成 true
          congestion: bbr            # bbr / brutal / force-brutal / reno
          brutal-up: 0               # 单位是 bps；只有 congestion 为 brutal/force-brutal 才读取
          brutal-down: 0             # 单位是 bps
        ssl:                         # QUIC 传输层自己校验证书，所以必须写在 quic 节点里
          sni: example.com
          verify: true
    - protocol: tls
      tag: tls
      config:
        ssl:
          sni: example.com
          verify: true
    - protocol: trojan
      tag: trojan
      config:
        password:
          - your-secure-password-here
  path:
    - - quic
      - tls
      - trojan

# log-level 是 int，且级别是反的：0=All 1=Info 2=Warn 3=Error 4=Fatal 5=Off
log-level: 1
