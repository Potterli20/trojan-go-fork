run-type: server
local-addr: 0.0.0.0
local-port: 443
remote-addr: 127.0.0.1
remote-port: 80
password:
  - your_password
ssl:
  cert: your_cert.crt
  key: your_key.key
  sni: your-domain-name.com
outbound-local-addr: 192.168.1.100
outbound-fwmark: 256
router:
  enabled: true
  block:
    - 'geoip:private'
  geoip: /usr/share/trojan-go/geoip.dat
  geosite: /usr/share/trojan-go/geosite.dat

# 指定本服务器与真实目标建立 TCP/UDP 连接时使用的源 IP
# 用于配合策略路由 (ip rule from <此 IP> table <xxx>) 选择出口接口
# 仅接受 IP (IPv4 或 IPv6);未配置时使用系统默认源 IP;非法值会导致启动失败
# outbound-local-addr: 192.168.1.100