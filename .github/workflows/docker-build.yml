name: docker-release
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
    tags:
      - '**'
    
jobs:
  build:
    if: github.repository == 'Potterli20/trojan-go-fork'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the code
        uses: actions/checkout@main

      - name: Setup QEMU
        uses: docker/setup-qemu-action@master

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@master

      - name: Login to Docker Hub
        uses: docker/login-action@master
        with:
          username: ${{ secrets.DOCKERUSERNAME }}
          password: ${{ secrets.DOCKERPASSWORD }}

      - name: Login to GitHub Packages
        uses: docker/login-action@master
        with:
          registry: ghcr.io
          username: ${{ secrets.GITHUBUSERNAME }}
          password: ${{ secrets.GITHUBTOKEN }}

      - name: Prepare
        id: prepare
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "ref=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "ref=${GITHUB_SHA}" >> $GITHUB_ENV
          fi
          echo "docker_platforms=linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le,linux/s390x,linux/386" >> $GITHUB_ENV
          echo "docker_image=${{ secrets.DOCKERUSERNAME }}/trojan-go-fork" >> $GITHUB_ENV
          echo "github_image=ghcr.io/${{ secrets.GITHUBUSERNAME }}/trojan-go-fork" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV
          echo "docker_image_lower=$(echo ${{ secrets.DOCKERUSERNAME }}/trojan-go-fork | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "github_image_lower=$(echo ghcr.io/${{ secrets.GITHUBUSERNAME }}/trojan-go-fork | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push docker image
        run: |
          # snapshot / latest 是**可变别名**：master 的每次构建都覆盖同一个 snapshot，
          # 于是历史构建在下一次 push 之后就再也拉不回来（ghcr 上只留最后一份）。
          # 额外打一枚不可变的 sha-<short>，配合下面的 digest 才能按次回捞任意一次构建。
          immutable="sha-$(echo "$GITHUB_SHA" | cut -c1-8)"
          tags="snapshot $immutable"
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            tags="${GITHUB_REF#refs/tags/} latest $immutable"
          fi

          # 一次构建把该次的所有标签一起推（多个 --tag），而不是每个标签重跑一遍 6 平台
          # 矩阵：加标签不该把 CI 时间与构建负载按标签数翻倍。旧写法是 for tag → build，
          # 发布构建本来就跑两遍，master 加了 sha- 之后要跑三遍。
          tag_args=()
          for tag in $tags; do
            tag_args+=(--tag "${{ env.docker_image_lower }}:$tag")
            tag_args+=(--tag "${{ env.github_image_lower }}:$tag")
          done

          docker buildx build \
            --platform ${{ env.docker_platforms }} \
            --output "type=image,push=true" \
            "${tag_args[@]}" \
            --build-arg REF=${{ env.ref }} \
            --metadata-file meta.json \
            --file Dockerfile .

          # digest 是真正永生的坐标（标签可以被覆盖或删除）：连标签一起落进 job summary，
          # 事后要复原某一次构建就按 digest 拉，而不是按标签猜。
          digest=$(jq -r '."containerimage.digest" // "未知（metadata 里没有 digest）"' meta.json)
          {
            echo "## Pushed images"
            echo
            echo "| 标签 | digest |"
            echo "| --- | --- |"
            for tag in $tags; do
              echo "| \`$tag\` | \`${{ env.github_image_lower }}@$digest\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the code
        uses: actions/checkout@main

      - name: Cache Docker layers
        uses: actions/cache@main
        with:
          path: /path/to/cache
          key: ${{ runner.os }}-docker-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-docker-
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@master

      - name: Test docker image from Docker Hub
        run: |
          docker run --rm --entrypoint /usr/local/bin/trojan-go-fork ${{ secrets.DOCKERUSERNAME }}/trojan-go-fork -version

      - name: Test docker image from GitHub Packages
        run: |
          docker run --rm --entrypoint /usr/local/bin/trojan-go-fork ghcr.io/potterli20/trojan-go-fork -version
