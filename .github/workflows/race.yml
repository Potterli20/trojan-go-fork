name: race
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  race:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Go version
        uses: actions/checkout@main
      - name: Setup Go
        uses: actions/setup-go@main
        with:
          go-version: ^1.27
      - name: Run tests with the race detector
        run: make test-race
