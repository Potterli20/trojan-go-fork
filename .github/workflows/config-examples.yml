name: config-examples
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# 示例配置与文档里的配置键，没有任何 Go 测试会去加载它们；而 Go 的 encoding/json
# 会静默忽略未知键。这两件事叠加，导致 `quic.enabled`、`ssl.verify-cert`、`api.user`、
# `statistic.type` 一类编造键，以及 `log-level: info`（该字段是 int，启动即 FATAL）
# 能长期留在仓库里。这道工作流专门拦这两类，分两个判据：
#   * 前一步把 config/*.yaml 与文档里的 ```yaml 代码块逐段还原出来，一起喂给真实二进制，
#     只有这条路能抓到值类型错误（`log-level: info`）——Python 侧算不出 int/bool 的期望类型。
#   * 后一步 check-config-keys.py 按 (父节, 键) 比名字，抓的是放错节的编造键。
#   * 最后一步 check-md-anchors.py 重算标题 id，抓目录里的死锚点（与配置无关，
#     只是同属"文档写了但没人验证"这一类，共用这道工作流）。
jobs:
  config-examples:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout codebase
        uses: actions/checkout@main

      - name: Setup Go
        uses: actions/setup-go@main
        with:
          go-version: ^1.27

      - name: Build
        run: make

      - name: Load every example config
        env:
          SHADOWSOCKS_SF_CAPACITY: "-1"
          # 提取器会 import 同级审计脚本取 DOC_FILES，别让它在 .github/ 里落下 __pycache__
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -u
          BIN=build/trojan-go-fork
          test -x "$BIN" || { echo "::error::make 没产出 $BIN"; exit 1; }
          docdir=$(mktemp -d)
          python3 .github/extract-doc-yaml.py "$docdir"
          scanned=0
          failed=0
          # 逐份把配置喂给真实二进制，判据只看 grep 到的错误，**不看退出码**：Actions 给
          # run 用的是 `bash -e`，而这一行在 CI 里必然非零退出——配置能解析时进程会一直
          # 服务到 timeout 收工（rc=124），占位证书、443 端口权限、诱饵地址不通又会让它
          # rc=1 快速失败。裸写这一行会在第一份配置就以 124 终止整步，连后面的分母自检
          # 都跑不到。8 秒的上限只用来兜"解析已完成、进程赖着不走"这一种情况。
          probe() {
            local f="$1" out rc
            out=$(mktemp)
            rc=0
            timeout 8 "$BIN" -config "$f" >"$out" 2>&1 || rc=$?
            # 反序列化失败才是配置写错
            if grep -q 'unmarshal errors' "$out"; then
              echo "::error file=$f::$f 无法被解析"
              grep -A2 'unmarshal errors' "$out" | head -4
              failed=$((failed + 1))
            # 分子自证：没走到加载配置那一行，说明 -config 这条 CLI 接线变了，
            # 上面那个 grep 会在空文件上永远不命中、白过。两种触发方式：CLI 接线改了，
            # 或者这份配置把 log-level 调到 3 以上、把 INFO/WARN 一起关掉了。
            elif ! grep -q 'Found handler: PROXY' "$out"; then
              echo "::error file=$f::$f 没走到加载配置这一步（rc=$rc），或该文件的 log-level 关掉了 INFO"
              head -20 "$out"
              failed=$((failed + 1))
            fi
            rm -f "$out"
          }
          for f in config/*.yaml; do
            scanned=$((scanned + 1))
            probe "$f"
          done
          # 文档里的 ```yaml 代码块同样实喂一遍：下一那步的 Python 审计只比 (节,键) 名，
          # 不看值类型，`log-level: info` 写在文档里今天照样能全绿。
          docs=0
          for f in "$docdir"/*.yaml; do
            docs=$((docs + 1))
            probe "$f"
          done
          # 分母自证：glob 失配时 scanned/docs=0，绝不能当成通过
          if [ "$scanned" -lt 5 ]; then
            echo "::error::只扫到 $scanned 份示例配置（下限 5）—— 文件名可能已改动"
            exit 1
          fi
          if [ "$docs" -lt 12 ]; then
            echo "::error::只从文档里取出 $docs 段 yaml 代码块（下限 12）—— 提取器或围栏写法变了"
            exit 1
          fi
          echo "扫到 $scanned 份示例配置 + $docs 段文档 yaml，反序列化失败 $failed 份"
          [ "$failed" -eq 0 ] || exit 1

      - name: Check config keys in docs and examples
        run: python3 .github/check-config-keys.py

      # 目录里的站内锚点没有任何测试会去点：`(#cdn 中转配置)` 这种带空格的写法
      # 从 GitHub 上线那天起就是死链，页面不报错、CI 不变红，可以一路烂到文档改版。
      # check-md-anchors.py 按 github-slugger 的规则重算每个标题的 id 并逐个比对。
      - name: Check markdown anchors in docs
        run: python3 .github/check-md-anchors.py
